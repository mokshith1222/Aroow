<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <!-- Capacitor: viewport-fit=cover handles notches/safe areas; user-scalable=no prevents pinch zoom -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=no" />
    <!-- Android status bar colour matches game dark theme -->
    <meta name="theme-color" content="#09090C" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="description" content="Aroow — a minimalist arrow puzzle game" />
    <title>Aroow</title>
    <script>
      try {
        var data = localStorage.getItem('arrow_puzzle_save') || localStorage.getItem('arrow_puzzle_save_v1');
        var colorMode = 'dark'; // default
        if (data) {
          var parsed = JSON.parse(data);
          if (parsed && parsed.colorMode === 'light') {
            colorMode = 'light';
          }
        }
        document.documentElement.setAttribute('data-color-mode', colorMode);
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
